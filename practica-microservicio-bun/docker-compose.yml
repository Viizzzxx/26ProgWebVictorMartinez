services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_microservicio
    restart: always

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: escuela

    ports:
      - "5434:5432"

    volumes:
      - postgres_microservicio_data:/var/lib/postgresql/data

volumes:
  postgres_microservicio_data:
